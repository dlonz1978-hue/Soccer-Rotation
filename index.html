<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075f34"><title>Soccer Rotation Sheet</title><style>
:root{color-scheme:light dark;--bg:#f2f6f3;--panel:#fff;--text:#122019;--muted:#59665e;--line:#9eaca3;--green:#08713e;--greenbg:#dff5e8;--orange:#a45000;--orangebg:#ffe3bc;--red:#8c2222}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.2}button,input{font:inherit}button{touch-action:manipulation;font-weight:800;border-radius:7px;border:1px solid transparent;cursor:pointer}.wrap{width:min(980px,100%);margin:auto;padding:6px}.top{background:#08683b;color:#fff;padding:7px 8px}.top h1{margin:0;font-size:1.05rem}.top p{margin:2px 0 0;font-size:.74rem}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px;margin:6px 0}.panel h2{font-size:1rem;margin:0 0 5px}.panel h3{font-size:.9rem;margin:7px 0 3px}.primary{background:#075f34;color:#fff}.secondary{background:var(--panel);color:var(--text);border-color:var(--line)}.danger{background:var(--red);color:#fff}button:focus-visible,input:focus-visible{outline:3px solid #ffcf24;outline-offset:1px}.setup-row{display:grid;grid-template-columns:minmax(0,180px) auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);justify-content:start}.setup-row input[type=text]{width:100%;max-width:180px;min-height:34px;padding:5px 6px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px}.checks label,.block-choice label{display:flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}.checks input,.block-choice input{width:18px;height:18px}.block-choice{display:flex;gap:10px;flex-wrap:wrap;padding:3px 0}.sheetwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain}.sheet{width:100%;border-collapse:collapse;table-layout:fixed;min-width:600px;font-size:12px}.sheet.ten{min-width:690px}.sheet th,.sheet td{border:1px solid var(--line);text-align:center;padding:2px}.sheet th{font-size:10px;line-height:1.05;height:28px}.sheet th:first-child,.sheet td:first-child{width:105px;position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;font-weight:850;padding-left:5px}.cellbtn{width:100%;min-height:34px;padding:2px 1px;border-radius:5px;border:1px solid transparent;background:#edf0ee;color:#26332c;font-size:11px;white-space:nowrap}.cellbtn.on{background:var(--greenbg);color:#063b21;border-color:#45a477}.cellbtn.off{background:var(--orangebg);color:#522900;border-color:#e08a26}.cellbtn.future{background:transparent;border:1px dashed var(--line);color:var(--muted)}.cellbtn:disabled{opacity:.5}.status{font-weight:900;font-size:.9rem;margin:2px 0 5px}.legend{display:flex;gap:5px;margin-bottom:5px;font-size:11px;font-weight:750}.legend span{padding:3px 5px;border-radius:5px}.onkey{background:var(--greenbg);color:#063b21}.offkey{background:var(--orangebg);color:#522900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.actions button{min-height:38px;padding:5px 6px}.actions .danger{grid-column:1/-1;min-height:34px}.note{color:var(--muted);margin:4px 0}[hidden]{display:none!important}dialog{border:0;border-radius:10px;background:var(--panel);color:var(--text);width:calc(100% - 20px);max-width:390px;padding:12px}dialog::backdrop{background:#0009}@media(max-width:420px){.top p{display:none}.setup-row{grid-template-columns:minmax(0,155px) auto}.setup-row input[type=text]{max-width:155px}.sheet{min-width:560px}.sheet.ten{min-width:650px}.sheet th:first-child,.sheet td:first-child{width:96px}.cellbtn{min-height:32px;font-size:10.5px}.panel{padding:5px}.wrap{padding:4px}}@media(prefers-color-scheme:dark){:root{--bg:#0e1712;--panel:#17231d;--text:#f2f7f4;--muted:#bdc9c1;--line:#46564c;--greenbg:#123d29;--orangebg:#51310b}.onkey,.cellbtn.on{color:#ecfff3}.offkey,.cellbtn.off{color:#fff0d2}.cellbtn{background:#26332c;color:#f2f7f4}}
</style></head><body><header class="top"><div class="wrap"><h1>⚽ Soccer Rotation Sheet</h1></div></header>
<main id="setup" class="wrap"><section class="panel"><h2>Setup</h2><div id="players"></div><h3>Rotation blocks</h3><div class="block-choice"><label><input type="radio" name="duration" value="5" checked> Sub every 5 mins</label><label><input type="radio" name="duration" value="4"> Sub every 4 mins</label></div><p id="error" class="note"></p><button class="primary" id="start" type="button">Start Sheet</button></section></main>
<main id="game" class="wrap" hidden><section class="panel"><p class="status" id="blockStatus"></p><div class="legend"><span class="onkey">● On</span><span class="offkey">✓ Off</span></div><div class="sheetwrap"><table id="sheet" class="sheet"><thead><tr id="headrow"><th>Player</th></tr></thead><tbody id="grid"></tbody></table></div></section><section class="panel"><div class="actions"><button id="next" class="primary" type="button">Next block</button><button id="back" class="secondary" type="button">Undo / Previous</button><button id="reset" class="danger" type="button">Reset Game</button></div></section></main>
<dialog id="confirm"><h2>Reset game?</h2><p>This clears this sheet and restores the default player list.</p><div class="actions"><button class="secondary" id="cancel" type="button">Cancel</button><button class="danger" id="doReset" type="button">Reset</button></div></dialog>
<script>'use strict';const N=['Max L','Max S','Toby','Vinny','Leo','Lucas','Lori','Jacob','Dakota','Marlo'],KEY='soccerPaperGrid.v7',$=s=>document.querySelector(s);const fresh=()=>({v:7,screen:'setup',block:0,duration:5,players:N.map((name,i)=>({id:'p'+i,name,playing:true})),grid:{}});let S=load();function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.v===7?x:fresh()}catch(e){return fresh()}}function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function esc(x){return String(x).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function active(){return S.players.filter(x=>x.playing)}function blocks(){return S.duration===4?10:8}function renderSetup(){let h='';S.players.forEach((p,i)=>h+=`<div class="setup-row"><input id="n${i}" aria-label="Player ${i+1} name" value="${esc(p.name)}" maxlength="30"><div class="checks"><label><input type="checkbox" data-playing="${p.id}" ${p.playing?'checked':''}> Playing</label></div></div>`);$('#players').innerHTML=h;const d=document.querySelector(`input[name="duration"][value="${S.duration}"]`);if(d)d.checked=true;validate()}function syncPlayers(){S.players.forEach((p,i)=>{p.name=$('#n'+i).value.trim()||`Player ${i+1}`;p.playing=$(`[data-playing="${p.id}"]`).checked});save();renderSetup()}function validate(){const e=active().length?'':'Mark at least one player as Playing.';$('#error').textContent=e;$('#start').disabled=!!e}function begin(){if($('#start').disabled)return;S.duration=Number(document.querySelector('input[name="duration"]:checked').value);S.screen='game';S.block=0;S.grid={};active().forEach(p=>S.grid[p.id]=['on']);save();render()}function subCount(id){let n=0;for(let b=0;b<=S.block;b++)if(S.grid[id]?.[b]==='off')n++;return n}function toggle(id){const row=S.grid[id];row[S.block]=row[S.block]==='off'?'on':'off';save();renderGrid()}function next(){if(S.block>=blocks()-1)return;S.block++;active().forEach(p=>S.grid[p.id][S.block]='on');save();render()}function back(){if(S.block<=0)return;active().forEach(p=>S.grid[p.id].splice(S.block,1));S.block--;save();render()}function renderHeader(){const total=blocks();$('#headrow').innerHTML='<th>Player</th>'+Array.from({length:total},(_,i)=>`<th>${i+1}</th>`).join('');$('#sheet').className='sheet '+(total===10?'ten':'')}function renderGrid(){renderHeader();const total=blocks();$('#grid').innerHTML=active().map(p=>`<tr><td>${esc(p.name)} (${subCount(p.id)})</td>${Array.from({length:total},(_,b)=>{if(b>S.block)return `<td><button class="cellbtn future" disabled aria-label="${esc(p.name)}, future block ${b+1}">&nbsp;</button></td>`;const v=S.grid[p.id]?.[b]||'on',current=b===S.block,txt=v==='off'?'✓ Off':'● On';return `<td><button type="button" data-cell="${p.id}" class="cellbtn ${v}" ${current?'':'disabled'} aria-label="${esc(p.name)}, block ${b+1}, ${v}">${txt}</button></td>`}).join('')}</tr>`).join('');document.querySelectorAll('[data-cell]').forEach(b=>b.addEventListener('click',()=>toggle(b.dataset.cell)));$('#blockStatus').textContent=`Block ${S.block+1} of ${total}`;$('#next').textContent=S.block<total-1?`Next ${S.duration}-min block`:'Final block';$('#next').disabled=S.block>=total-1;$('#back').disabled=S.block<=0}function render(){const g=S.screen==='game';$('#setup').hidden=g;$('#game').hidden=!g;if(g)renderGrid();else renderSetup()}$('#players').addEventListener('change',syncPlayers);$('#players').addEventListener('input',e=>{if(e.target.id?.startsWith('n')){const i=+e.target.id.slice(1);S.players[i].name=e.target.value;save()}});document.querySelectorAll('input[name="duration"]').forEach(r=>r.addEventListener('change',()=>{S.duration=Number(r.value);save()}));$('#start').addEventListener('click',begin);$('#next').addEventListener('click',next);$('#back').addEventListener('click',back);$('#reset').addEventListener('click',()=>$('#confirm').showModal());$('#cancel').addEventListener('click',()=>$('#confirm').close());$('#doReset').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();$('#confirm').close();render()});render();</script></body></html>
